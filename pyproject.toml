[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gotdms"
version = "0.1.0"
description = "MIT Python client for the gotdms TDMS reader and writer. NumPy arrays and Polars frames, with the gotdms-bridge binary bundled in the wheel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md", "licenses/go/*"]
requires-python = ">=3.10"
authors = [{ name = "Trey Copeland" }]
keywords = ["tdms", "labview", "polars", "numpy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "polars>=2",
  "pyarrow>=14",
  # Polars turns a Datetime column with a time zone (every time column this
  # package returns is Datetime("ns", "UTC")) into Python datetimes through
  # zoneinfo. Windows has no system IANA database, so without tzdata
  # to_list(), rows(), and iteration raise ZoneInfoNotFoundError for "UTC".
  "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/trey-copeland/gotdms-python"
Repository = "https://github.com/trey-copeland/gotdms-python"
Core = "https://github.com/trey-copeland/gotdms"
Changelog = "https://github.com/trey-copeland/gotdms-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["python/src/gotdms"]

[tool.hatch.build.targets.wheel.sources]
"python/src" = ""

[tool.hatch.build.targets.sdist]
include = [
  "/python/src/gotdms",
  "/cmd",
  "/docs",
  "/licenses",
  "/scripts",
  "/hatch_build.py",
  "/go.mod",
  "/go.sum",
  "/*.go",
  "/LICENSE",
  "/README.md",
  "/THIRD_PARTY.md",
  "/EXTRACTION.md",
  "/CHANGELOG.md",
]
exclude = [
  "/python/src/gotdms/_bin",
  "**/__pycache__",
  "**/*.pyc",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
