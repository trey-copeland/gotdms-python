# Build an sdist and a linux/amd64 wheel from the repository root.
# go.mod requires github.com/trey-copeland/gotdms at a pseudo-version, so
# the Go build downloads that module. This workflow does not check out
# gotdms or add a replace directive.

name: 'Build and verify Python packages'

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-and-verify-python-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build hatchling twine

      - name: Source distribution
        run: python scripts/build_dist.py --sdist

      - name: Linux amd64 wheel
        run: python scripts/build_dist.py --goos linux --goarch amd64 --platform-tag manylinux_2_17_x86_64

      - name: Metadata check
        run: python -m twine check dist/*

      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/gotdms-venv
          /tmp/gotdms-venv/bin/pip install dist/*manylinux*.whl
          cd /tmp
          unset GOTDMS_BRIDGE
          /tmp/gotdms-venv/bin/python - <<'PY'
          import gotdms
          path = gotdms.locate_binary()
          print(path)
          assert "_bin" in path
          assert "GOTDMS_BRIDGE" not in __import__("os").environ
          PY

      - name: Python tests against a built binary
        # nptdms is LGPL-3.0-only. Installed in this venv only so the oracle
        # test can read a file the package wrote. Not a project dependency.
        run: |
          /tmp/gotdms-venv/bin/pip install nptdms
          /tmp/gotdms-venv/bin/python -m unittest discover -s python/tests
